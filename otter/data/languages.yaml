# otter Toy0 calibration 조건 정의
#
# source: israel/flores-parallel (HuggingFace, ungated) -- ferret_kr에서 이미
# 검증된 것과 동일한 근거로 사용. facebook/flores 공식 배포본은 게이트(auto-approve)가
# 걸려 있어 이 커뮤니티 재업로드본을 대신 사용한다. test split == 1012행, 컬럼명은
# sentence_<lang_code> (예: sentence_kor_Hang).
#
# zho_Hans(중국어 간체) 컬럼 존재는 미확인 상태 -- 01_calibration_stats.py를 처음
# 돌릴 때 data_utils.load_flores_sentences가 KeyError로 사용 가능한 컬럼 목록을
# 보여준다. 없으면 zho_Hant로 대체하고 이 파일의 zh 관련 항목을 갱신할 것.
#
# Toy0은 압축을 하지 않으므로 "calibration"은 실제로는 forward-pass probe 입력일
# 뿐이다 -- D²-MoE 압축이 실제로 소비할 calibration set(§4 MVP, 128 seq x 512 tok)
# 과는 스케일이 다르다. 여기서는 라우팅/중요도 신호의 유무만 싸게 확인한다.

source: israel/flores-parallel
split: test
column_prefix: "sentence_"

languages:
  eng_Latn: English
  kor_Hang: Korean
  zho_Hans: Chinese (Simplified)

# 각 조건마다 (lang_code, n_sentences, offset)의 리스트. offset은 조건 간
# 문장이 겹치지 않도록 미리 잘라둔 것 -- en_only와 en_only_control은 같은 언어의
# *다른* 문장 집합이어야 "동일 언어 내 재표집 노이즈"의 기준선(noise floor)이 된다.
conditions:
  en_only:
    - [eng_Latn, 30, 0]        # sentences [0:30)
  en_only_control:
    - [eng_Latn, 30, 30]       # sentences [30:60) -- same-language noise floor
  ko_only:
    - [kor_Hang, 30, 0]
  zh_only:
    - [zho_Hans, 30, 0]
  balanced:
    - [eng_Latn, 10, 60]       # sentences [60:70), disjoint from en_only/_control
    - [kor_Hang, 10, 30]       # disjoint from ko_only
    - [zho_Hans, 10, 30]       # disjoint from zh_only
