model:
  name: ibm-granite/granite-3.0-1b-a400m-base
  dtype: bfloat16
  device: cuda:1   # RTX3090 #1 (idle GPU on this shared 4x3090 host)
  architecture_note: >
    GraniteMoE: 24 layers, all MoE, 32 local experts, top-8 routing,
    hidden_size=1024, intermediate_size=512. SwiGLU-style gated experts
    (gate_up_proj + down_proj), no per-expert nn.Linear (batched 3D weight).
    Chosen instead of a 7B-class MoE because only ~39GB free disk was
    available on this shared host; full bf16 checkpoint is ~5.5GB, safely
    fits without bitsandbytes/4-bit loading (model already fits in <3GB
    VRAM at bf16 in full precision on one 24GB GPU).

data:
  source: wikitext-2-raw-v1 (validation split)
  seq_len: 256
  n_calib_sequences: 16
  n_eval_sequences: 16
  batch_size: 1
  use_cache: false

layer_selection:
  n_layers_to_probe: 2
  position: [middle, late]

expert_selection:
  n_experts_per_layer: 2
  min_token_count: 500

intervention: down_proj_only   # Toy0-A

rank_grid_ratios: [0.125, 0.25, 0.375, 0.5, 0.75, 1.0]
rank_round_to: 16

thresholds_epsilon: [0.01, 0.02, 0.05, 0.10]
primary_epsilon: 0.05

bootstrap:
  n_resamples: 2000
  level: sequence
  seed: 0

random_mixture:
  n_seeds: 10
